<?xml version="1.0" encoding="UTF-8"?>
<!-- sparkTerminal icon: original design (terminal window with a prompt and a "+" tab). MIT License, copyright Shrinivas Kodati -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- window body: dark rounded rectangle -->
  <rect x="8" y="16" width="112" height="96" rx="10" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="3"/>
  <!-- title/tab bar across the top -->
  <rect x="8" y="16" width="112" height="22" rx="10" fill="#2e2e2e"/>
  <!-- fills the lower rounded corners of the tab bar so it meets the body squarely -->
  <rect x="8" y="28" width="112" height="10" fill="#2e2e2e"/>
  <!-- active tab, underlined in green -->
  <rect x="16" y="22" width="34" height="12" rx="3" fill="#3c3c3c"/>
  <!-- green underline of the active tab -->
  <rect x="16" y="33" width="34" height="3" fill="#33cc33"/>
  <!-- "+" new-tab sign: horizontal bar -->
  <rect x="98" y="26" width="12" height="3" rx="1" fill="#d0d0d0"/>
  <!-- "+" new-tab sign: vertical bar -->
  <rect x="102.5" y="21.5" width="3" height="12" rx="1" fill="#d0d0d0"/>
  <!-- prompt chevron ">" in green -->
  <polyline points="24,56 40,68 24,80" fill="none" stroke="#33cc33" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor block in green -->
  <rect x="50" y="74" width="26" height="8" rx="2" fill="#33cc33"/>
</svg>
